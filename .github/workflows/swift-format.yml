name: Swift Format

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/swift-format.yml'
      - '**/*.swift'
      - '.swift-format'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/swift-format.yml'
      - '**/*.swift'
      - '.swift-format'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: swift-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-format:
    name: Swift Format
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # swift-format ships with the Swift 6 toolchain (`swift format`), no Mint needed.
      - name: Check formatting
        run: swift format lint --strict --configuration .swift-format --recursive Package.swift Sources Tests scripts
