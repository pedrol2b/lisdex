pre-commit:
  parallel: true
  commands:
    swift-format:
      glob: "*.swift"
      run: swift format lint --strict --configuration .swift-format {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert)(\([a-z0-9 /-]+\))?!?: .+' \
          || { echo "Commit message must follow Conventional Commits, e.g. 'feat: add schedule editor'"; exit 1; }
